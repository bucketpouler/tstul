
name: Tulipe - Votes toutes les 10 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: tulipe-votes
  cancel-in-progress: false

jobs:
  voter:
    name: Voter sur les 4 topsites
    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Voter avec Tulipe
        run: python vote.py

      - name: Sauvegarder les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-tulipe-${{ github.run_number }}
          path: captures/
          if-no-files-found: warn
          retention-days: 3
