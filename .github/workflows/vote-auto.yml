
name: Tulipe - 50 cycles automatiques

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: tulipe-votes-automatiques
  cancel-in-progress: false

jobs:
  voter:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verifier le compteur et le delai
        id: controle
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          fichier = Path("vote-state.json")
          etat = {"cycles": 0, "dernier": 0}

          if fichier.exists():
              etat.update(json.loads(
                  fichier.read_text(encoding="utf-8")
              ))

          cycles = int(etat["cycles"])
          dernier = int(etat["dernier"])
          maintenant = int(time.time())

          autorise = (
              cycles < 50
              and (maintenant - dernier) >= 7200
          )

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as sortie:
              sortie.write(
                  f"autorise={str(autorise).lower()}\n"
              )

          print(f"Cycles deja effectues : {cycles}/50")

          if not autorise:
              print("Cycle ignore : limite ou delai.")
          PY

      - name: Configurer Python
        if: steps.controle.outputs.autorise == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Playwright
        if: steps.controle.outputs.autorise == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Enregistrer le cycle
        if: steps.controle.outputs.autorise == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          fichier = Path("vote-state.json")
          etat = {"cycles": 0, "dernier": 0}

          if fichier.exists():
              etat.update(json.loads(
                  fichier.read_text(encoding="utf-8")
              ))

          etat["cycles"] += 1
          etat["dernier"] = int(time.time())

          fichier.write_text(
              json.dumps(etat, indent=2) + "\n",
              encoding="utf-8"
          )

          print(
              f"Cycle {etat['cycles']}/50 enregistre."
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add vote-state.json
          git commit -m "Tulipe - mise a jour du compteur"
          git push

      - name: Voter sur les 4 topsites
        if: steps.controle.outputs.autorise == 'true'
        run: python vote.py

      - name: Sauvegarder les captures
        if: always() && steps.controle.outputs.autorise == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: captures-tulipe-${{ github.run_number }}
          path: captures/
          if-no-files-found: warn
          retention-days: 7

      - name: Fin
        if: steps.controle.outputs.autorise == 'true'
        run: |
          echo "Cycle termine."
          echo "Maximum : 50 cycles."
