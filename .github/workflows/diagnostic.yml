  regrouper:
    name: Regrouper les 50 rapports
    needs: diagnostic
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger tous les rapports
        uses: actions/download-artifact@v4
        with:
          pattern: rapport-cycle-*
          path: tous-les-rapports
          merge-multiple: true

      - name: Créer une archive ZIP
        run: |
          cd tous-les-rapports
          zip -r ../rapports-complets.zip .

      - name: Publier l'archive
        uses: actions/upload-artifact@v4
        with:
          name: RAPPORT-COMPLET-50-CYCLES
          path: rapports-complets.zip
          retention-days: 7
